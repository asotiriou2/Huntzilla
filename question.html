<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <title>App</title>

    <link rel="stylesheet" href="css/question.css" />

    <link href="https://fonts.googleapis.com/css2?family=Bahiana&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body>
    <header>
        <nav id="desktop-nav">
            <ul>
                <li class="menu-option" id="logo">
                    <h1>Huntzilla</h1>
                </li>
                <li class="menu-option">
                    <a href="index.html">Home</a>
                </li>
                <li class="menu-option">
                    <a href="app.html">Treasure Hunt</a>
                </li>
                <li class="menu-option">
                   <a href="leaderboard.html">Leaderboard</a>
                </li>
            </ul>
        </nav>
        <nav id="hamburger">
            <button id="burger-button">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                    <g id="SVGRepo_iconCarrier">
                        <!-- Uploaded to: SVG Repo, www.svgrepo.com, Generator: SVG Repo Mixer Tools -->
                        <path d="M20 7L4 7" stroke="#000000" stroke-width="1.5" stroke-linecap="round"></path>
                        <path d="M20 12L4 12" stroke="#000000" stroke-width="1.5" stroke-linecap="round"></path>
                        <path d="M20 17L4 17" stroke="#000000" stroke-width="1.5" stroke-linecap="round"></path>
                    </g>
                </svg>
            </button>
            <img src="./media/logo2.png" alt="Huntzilla Logo"/>

        </nav>
    </header>
    <div id="menu-overlay" aria-hidden="true">
        <button id="close-button">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                <g id="SVGRepo_iconCarrier">
                    <!-- Uploaded to: SVG Repo, www.svgrepo.com, Generator: SVG Repo Mixer Tools -->
                    <path
                            d="M19 5L4.99998 19M5.00001 5L19 19"
                            stroke="#000000"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                    ></path>
                </g>
            </svg>
        </button>
        <ul id="mobile-menu">
            <li class="menu-option">
                <a href="index.html">Home</a>
            </li>
            <li class="menu-option">
                <a href="app.html">Treasure Hunt</a>
            </li>
            <li class="menu-option">
                <a href="leaderboard.html">Leaderboard</a>
            </li>
        </ul>
    </div>
    <main>
        <div id="game-started" class="game-container" aria-hidden="true">
            <div id="breadcrumb">
                <img src="media/logo2.png" alt="Huntzilla Logo"/>

<!--                <a id="music-button" href="#"><svg id=`music-svg` viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#FFD700" stroke-width="0.8960000000000001" color="rgb(255, 215, 0)"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier">&lt;!&ndash; Uploaded to: SVG Repo, www.svgrepo.com, Generator: SVG Repo Mixer Tools &ndash;&gt; <path d="M6 1H8V15H6L2 11H0V5H2L6 1Z" fill="#26d51b"></path> <path d="M14 8C14 5.79086 12.2091 4 10 4V2C13.3137 2 16 4.68629 16 8C16 11.3137 13.3137 14 10 14V12C12.2091 12 14 10.2091 14 8Z" fill="#26d51b"></path> <path d="M12 8C12 9.10457 11.1046 10 10 10V6C11.1046 6 12 6.89543 12 8Z" fill="#26d51b"></path> </g></svg></a>-->

<!--                    <audio id="jingle" loop>-->
<!--                        <source src="media/jingle.mp3" type="audio/mpeg">-->
<!--                    </audio>-->
            </div>
            <div id="score-container" aria-hidden="true"></div>
            <div id="question-panel" aria-hidden="true">
                <div id="question-box">
                    <h3>Question</h3>
                    <p id="question"></p>
                </div>
                <div id="answer-choices">
                    <div id="boolean-answer" aria-hidden="true">
                        <p>Select True or False:</p>
                        <div class="buttons">
                            <button id="true" value="true">True</button>
                            <button id="false" value="false">False</button>
                        </div>

                    </div>
                    <div id="integer-answer" aria-hidden="true">
                        <label for="integer">Type your answer in the box below</label>
                        <input type="number" name="integer" id="integer" required min="-100" max="100" step="1" placeholder="Enter your answer here..."/>
                    </div>
                    <div id="numeric-answer" aria-hidden="true">
                        <label for="numeric">Type your answer in the box below:</label>
                        <input type="number" id="numeric" name="numeric" min="-100.0" max="100.0" required step="0.1" placeholder="Enter your answer here..."/>
                    </div>
                    <div id="mcq-answer" aria-hidden="true">
                        <p>Select one option below:</p>
                        <div class="buttons">
                            <button id="a" value="A">A</button>
                            <button id="b" value="B">B</button>
                            <button id="c" value="C">C</button>
                            <button id="d" value="D">D</button>
                        </div>

                    </div>
                    <div id="text-answer" aria-hidden="true">
                        <label for="input">Type your answer in the box below:</label>
                        <input type="text" id="input" name="input" placeholder="Enter your answer here..."/>
                    </div>
                </div>
                <div id="buttons">
                    <button id="submit-answer">Submit</button>
                </div>
                <p id="error" aria-hidden="true"></p>
            </div>
            <button id="skip" aria-hidden="true">
                <span>Skip</span>
                <svg fill="#000000" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                    <g id="SVGRepo_iconCarrier">
                        <!-- Uploaded to: SVG Repo, www.svgrepo.com, Generator: SVG Repo Mixer Tools -->
                        <path
                                d="M16.707,18.707a1,1,0,0,1-1.414-1.414L19.586,13H2a1,1,0,0,1,0-2H19.586L15.293,6.707a1,1,0,0,1,1.414-1.414l6,6a1,1,0,0,1,0,1.414Z"
                        ></path>
                    </g>
                </svg>

            </button>
        </div>
    </main>


    <script type="module" src="scripts/question.js"></script>
</body>
</html>
