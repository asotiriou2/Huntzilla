<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your clue · Huntzilla</title>
  <link rel="icon" type="image/png" href="media/brand/favicon-48.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="game">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- hunt name, time, score -->
  <header class="game-header">
    <div class="gh-row">
      <p class="gh-hunt" id="gh-hunt"></p>
      <p class="gh-time" id="gh-time">--:--</p>
      <p class="gh-score" id="gh-score">0 pts</p>
    </div>
    <p class="gh-clue" id="gh-clue">Clue</p>
    <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
  </header>

  <p class="offline-note" id="offline-note">No connection. Your clock is still running, so reconnect to keep playing. <button class="text-btn" type="button" onclick="loadQuestion()">Try again</button></p>

  <main class="screen" id="main">
    <p class="muted" id="loading">Getting your clue…</p>

    <!-- the clue -->
    <section id="clue-view" style="display: none">
      <div class="question-text" id="question-text"></div>
      <div id="answer-area"></div>
      <p class="field-error" id="answer-error"></p>
      <div class="clue-actions">
        <button class="btn btn-lg" type="button" id="submit-btn" onclick="submitAnswer()">Send answer</button>
      </div>
    </section>

    <!-- finished or time's up -->
    <section class="card end-card" id="end-view" style="display: none">
      <img src="media/brand/mascot-192.png" alt="" width="96" height="96">
      <h1 id="end-title"></h1>
      <p id="end-text"></p>
      <p class="end-score" id="end-score"></p>
      <div class="end-links">
        <a class="btn btn-light" href="app.html">Play another hunt</a>
        <a class="text-link" href="index.html">Back to the homepage</a>
      </div>
    </section>
  </main>

  <!-- popup for right / wrong / skip / errors -->
  <div class="dialog-back" id="dialog">
    <div class="dialog">
      <span class="dialog-icon" id="dlg-icon"></span>
      <h2 id="dlg-title"></h2>
      <p class="points" id="dlg-points"></p>
      <p id="dlg-text"></p>
      <button class="btn" type="button" id="dlg-ok" onclick="dialogOk()">OK</button>
      <button class="btn btn-light" type="button" id="dlg-cancel" onclick="hide('dialog')">Cancel</button>
    </div>
  </div>

  <script src="scripts/logic.js"></script>
  <script src="scripts/api.js"></script>
  <script src="scripts/state.js"></script>
  <script src="scripts/page.js"></script>
  <script src="scripts/header.js"></script>
  <script src="scripts/question.js"></script>
</body>
</html>
