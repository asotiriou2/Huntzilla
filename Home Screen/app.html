<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Huntzilla - Treasure Hunt App</title>
    <link rel="stylesheet" href="../app/style.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li class="menu-option" id="logo">
                    <h1>Huntzilla</h1>
                </li>
                <li class="menu-option">
                    <a href="Landing-page.html">Home</a>
                </li>
                <li class="menu-option">
                   <a href="/">Leaderboard</a>
                </li>
                <li class="menu-option">
                    <a id="music-button" href="#">Music Off: 🔇</a>
                </li>
                <audio id="jingle" loop>
                    <source src="../media/jingle.mp3" type="audio/mpeg">
                </audio>
            </ul>
        </nav>

    </header>
    <main>
        <div id="game">
            <img id="logozilla" src="../media/logo2.png" alt="Huntzilla Logo"/>
            <h2>Are You Ready to Hunt For Glory?</h2>

            <button id="start-game">START</button>
        </div>
    </main>

    <script src="../app/script.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bahiana&display=swap" rel="stylesheet">

</html>
