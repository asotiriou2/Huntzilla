<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Huntzilla - Treasure Hunt App</title>
    <link rel="stylesheet" href="css/app.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li class="menu-option" id="logo">
                    <h1>Huntzilla</h1>
                </li>
                <li class="menu-option">
                    <a href="index.html">Home</a>
                </li>
                <li class="menu-option">
                    <a href="app.html">Treasure Hunt</a>
                </li>
                <li class="menu-option">
                   <a href="leaderboard.html">Leaderboard</a>
                </li>
                <li class="menu-option">
                    <a id="music-button" href="#"><svg id=`music-svg` viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#FFD700" stroke-width="0.8960000000000001" color="rgb(255, 215, 0)"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"><!-- Uploaded to: SVG Repo, www.svgrepo.com, Generator: SVG Repo Mixer Tools --> <path d="M6 1H8V15H6L2 11H0V5H2L6 1Z" fill="#26d51b"></path> <path d="M14 8C14 5.79086 12.2091 4 10 4V2C13.3137 2 16 4.68629 16 8C16 11.3137 13.3137 14 10 14V12C12.2091 12 14 10.2091 14 8Z" fill="#26d51b"></path> <path d="M12 8C12 9.10457 11.1046 10 10 10V6C11.1046 6 12 6.89543 12 8Z" fill="#26d51b"></path> </g></svg></a>
                </li>
                <audio id="jingle" loop>
                    <source src="media/jingle.mp3" type="audio/mpeg">
                </audio>
            </ul>
        </nav>

    </header>
    <main>
        <div id="game-not-started" class="game-container" aria-hidden="true">
            <img id="logozilla" src="media/logo2.png" alt="Huntzilla Logo"/>
            <h2>Are You Ready to Hunt For Glory?</h2>

            <button id="start-game">START</button>
        </div>
        <div id="game-started" class="game-container" aria-hidden="true">
            <div id="breadcrumb">
                <button id="go-back" aria-hidden="true">< Go Back</button>
                <img src="media/logo2.png" alt="Huntzilla Logo"/>
            </div>
            <form id="treasure-hunt-form" aria-hidden="true">
                <div id="part-1" class="part-container" aria-hidden="true">
                    <p id="info">Select one of the available treasure hunts to play</p>
                    <ul id="treasure-hunts-list">
                        <!---Buttons added dynamically-->
                    </ul>
                </div>
                <div id="part-2" class="part-container" aria-hidden="true">
                    <div class="input-container">
                        <label for="player">Player Name:</label>
                        <input type="text" name="player" id="player" required/>
                    </div>
                    <input type="button" id="submit" value="Start Game"/>
                    <p id="error-message" aria-hidden="true"></p>
                </div>
            </form>
        </div>
    </main>

    <script type="module" src="scripts/app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bahiana&display=swap" rel="stylesheet">


</body>
</html>
