<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Huntzilla - Treasure Hunt App</title>
    <link rel="stylesheet" href="css/app.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li class="menu-option" id="logo">
                    <h1>Huntzilla</h1>
                </li>
                <li class="menu-option">
                    <a href="index.html">Home</a>
                </li>
                <li class="menu-option">
                   <a href="/">Leaderboard</a>
                </li>
                <li class="menu-option">
                    <a id="music-button" href="#">Music (Off)</a>
                </li>
                <audio id="jingle" loop>
                    <source src="media/jingle.mp3" type="audio/mpeg">
                </audio>
            </ul>
        </nav>

    </header>
    <main>
        <div id="game-not-started" class="game-container" aria-hidden="false">
            <img id="logozilla" src="media/logo2.png" alt="Huntzilla Logo"/>
            <h2>Are You Ready to Hunt For Glory?</h2>

            <button id="start-game">START</button>
        </div>
        <div id="game-started" class="game-container" aria-hidden="true">
            <div id="breadcrumb">
                <button id="go-back">< Go Back</button>
                <img src="../media/logo2.png" alt="Huntzilla Logo"/>
            </div>
            <form id="treasure-hunt-form">
                <div class="input-container">
                    <label for="player">Player Name:</label>
                    <input type="text" name="player" id="player" required/>
                </div>
                <div class="input-container">
                    <label for="world">World Name: </label>
                    <input type="text" name="world" id="world" required/>
                </div>
                <div class="treasure-hunts-container">
                    <p id="info">Choose one of the available treasure hunts</p>
                    <ul id="treasure-hunts-list">
                        <!---Buttons added dynamically-->
                    </ul>
                </div>
                <input type="button" id="submit" value="Play"/>
                <p id="error-message" aria-hidden="true"></p>
            </form>
        </div>
    </main>

    <script src="scripts/app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bahiana&display=swap" rel="stylesheet">


</body>
</html>
