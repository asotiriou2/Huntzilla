<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play Huntzilla</title>
  <meta name="description" content="Pick a live Huntzilla treasure hunt, answer the clues at real places and climb the leaderboard.">
  <link rel="icon" type="image/png" href="media/brand/favicon-48.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="game">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="bar-link" href="index.html">← Home</a>
    <a class="brand" href="index.html" title="Huntzilla home"><span class="wordmark wordmark--sm"><img src="media/brand/mascot-96.png" alt="" width="28" height="28"><span><span class="wm-a">Hunt</span><span class="wm-b">zilla</span></span></span></a>
    <button class="bar-link bar-right" type="button" onclick="show('help-dialog')">Help</button>
  </header>

  <main class="screen" id="main">
    <!-- the list of hunts -->
    <section id="list-view">
      <h1>Pick a hunt</h1>
      <div id="hunt-list">
        <p class="muted">Loading hunts…</p>
      </div>
      <div class="list-footer">
        <p class="muted" id="updated"></p>
        <button class="btn btn-light" type="button" onclick="loadHunts()">Refresh</button>
      </div>
    </section>
  </main>

  <!-- how to play -->
  <div class="dialog-back" id="help-dialog">
    <div class="dialog">
      <h2>How to play</h2>
      <ol class="rules">
        <li>Pick a live hunt and enter your name.</li>
        <li>Go to the place the clue points to and answer it.</li>
        <li>Right answers earn points. Wrong answers and skips cost points.</li>
        <li>Finish before the clock runs out.</li>
      </ol>
      <button class="btn" type="button" onclick="hide('help-dialog')">Got it</button>
    </div>
  </div>

  <script src="scripts/logic.js"></script>
  <script src="scripts/api.js"></script>
  <script src="scripts/state.js"></script>
  <script src="scripts/page.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
